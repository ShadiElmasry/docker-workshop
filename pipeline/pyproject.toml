[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shady Elmasry", email = "45492661+ShadiElmasry@users.noreply.github.com" }
]
requires-python = ">=3.14.4"
dependencies = [
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.1.1",
    "tqdm>=4.70.1",
]

[project.scripts]
pipline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
